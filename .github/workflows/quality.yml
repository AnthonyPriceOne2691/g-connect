name: quality

on:
  push:
    branches: [main]
  pull_request:

# Отмена устаревших прогонов той же ветки (CQG §8.3): из серии пушей осмыслен последний,
# а каждый прежний держал раннеры на код, который уже неактуален.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # merge_guard и baseline-ratchet сравнивают с origin/main — нужна история.
          fetch-depth: 0

      # База диффа — одна на джобу, отказ — вслух (CQG §8.3a, перенесено с cqg@2.55). Без
      # неё baseline-ratchet брал дефолт origin/main, а на push в main это сам HEAD: дифф
      # пуст, и ратчет проходил, ничего не сравнив. PR — ветка назначения; push — состояние
      # до толчка; ни то ни другое недостижимо — отказ с причиной, а не тихий фолбэк.
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (clean clone)
        run: npm ci

      # Тесты шва токена (D-24) гоняют НАСТОЯЩИЙ age с программным ключом (урок L32): без него
      # они пропускаются с названной причиной, а мутанты шва выживали бы молча.
      - name: age для тестов шва токена
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age

      # Шаги независимы и с `if: always()`: гейт за упавшим шагом не запускается
      # вовсе, и «зелёное» ниже означало бы «не проверялось» (Delivery §3.1a вопрос 2).
      - name: Typecheck
        if: always()
        run: npx tsc --noEmit

      - name: Tests
        if: always()
        run: npx vitest run

      # Отчёт покрытия, а не гейт: порога нет ни в vitest.config.ts, ни здесь. Прежнее имя
      # «Coverage (изменённый код)» обещало суд, которого не было (STACK-ACCEPTANCE, остатки).
      - name: Coverage (отчёт, порога нет)
        if: always()
        run: npx vitest run --coverage --reporter=dot

      # Проба СОБРАННОГО сервера по протоколу (smoke S11), без Google. Тесты видят сервер в
      # процессе, но не сборку: `dist` без папки `policy` отдавал 14 правил из 17 при
      # «успешной» сборке. До 2026-10-02 проба жила только в ручном smoke.
      - name: Сервер из dist говорит по протоколу (probe)
        if: always()
        run: npm run build && node scripts/probe_mcp.mjs

      - name: Gates (pre-commit, все хуки)
        if: always()
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Снимки только вниз (baseline-ratchet)
        if: always()
        run: bash scripts/lint/check_baseline_ratchet.sh

      - name: Контур поставки
        if: always()
        run: python3 scripts/delivery_check.py

      - name: Доктор контура (судит ли вписанное)
        if: always()
        run: python3 scripts/lint/contour_doctor.py

  # Мутационный гейт — отдельной джобой, параллельно quality, и только на PR: это
  # единственный оракул на вопрос «утверждают ли тесты хоть что-нибудь» (CQG §3).
  #
  # До 2026-10-17 здесь стоял `npx stryker run` по ВСЕМУ ядру без бюджета: 4993 мутанта
  # и 22 минуты в сентябре, 45+ минут после уровня 3 (61 файл) — 85–90% времени PR.
  # Теперь канонный гейт по ИЗМЕНЁННЫМ файлам ядра в маске stryker.config.json, четыре
  # доли параллельно, бюджет 1500 с на долю, «не просудил» — красное (cqg@2.64). Доля только
  # СЧИТАЕТ и выгружает счёт, порог судит джоба mutation-sum по сумме (CQG §3.7, урок L31:
  # порог на доле делал вердикт функцией разбиения). Полный прогон ядра — `npx stryker run`.
  # Бюджет — по самому тяжёлому файлу, а не по среднему: доля делится по файлам, и файл в
  # ней целиком. `src/core/sheets/map.ts` (609 мутантов, 33 статических гоняют весь набор) —
  # ~17 мин на раннере (замер 2026-10-19: 306 с локально, раннер медленнее в 3,3 раза);
  # при 600 с доля дважды не просудила ничего (PR #9).
  mutation:
    if: github.event_name == 'pull_request'
    name: mutation (доля ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # дифф с веткой назначения

      - name: Diff base (ветка назначения PR)
        run: |
          echo "BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          echo "база диффа: origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (clean clone)
        run: npm ci

      # Тесты шва токена (D-24) гоняют НАСТОЯЩИЙ age с программным ключом (урок L32): без него
      # они пропускаются с названной причиной, а мутанты шва выживали бы молча.
      - name: age для тестов шва токена
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age

      - name: Мутационный гейт (доля — счёт)
        env:
          LINT_TS_SRC: src
          LINT_FE_DIR: .
          MIN_KILLED: '60'
          BUDGET_SEC: '1500'
          MUTATION_SHARD: ${{ matrix.shard }}/4
        run: bash scripts/lint/check_mutation_gate.sh

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shards/

  # Порог — по сумме долей (CQG §3.7): доля без счёта для суммы — «не просудил», красное.
  mutation-sum:
    if: github.event_name == 'pull_request'
    name: mutation (сумма долей)
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-shard-*
          path: reports/mutation/shards/
          merge-multiple: true

      - name: Мутационный гейт (сумма долей — порог)
        env:
          LINT_TS_SRC: src
          LINT_FE_DIR: .
          MIN_KILLED: '60'
          MUTATION_SUM: '4'
        run: bash scripts/lint/check_mutation_gate.sh
