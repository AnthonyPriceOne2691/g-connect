name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (clean clone)
        run: npm ci

      # Шаги независимы и с `if: always()`: гейт за упавшим шагом не запускается вовсе,
      # и тогда «зелёное» ниже означало бы «не проверялось» (Delivery §3.1a вопрос 2).
      - name: Typecheck
        if: always()
        run: npx tsc --noEmit

      - name: Tests
        if: always()
        run: npx vitest run

      - name: Delivery contour
        if: always()
        run: python3 scripts/delivery_check.py
